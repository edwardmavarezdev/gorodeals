services:
  postgres:
    image: postgres:16-alpine
    container_name: gorodeals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gorodeals
      POSTGRES_PASSWORD: gorodeals
      POSTGRES_DB: gorodeals
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorodeals -d gorodeals"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
