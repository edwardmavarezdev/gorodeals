# Configuracion de host (VPS) para GoRoDeals.
# Se instala en /etc/nginx/sites-available/gorodeals.conf y se activa con un
# enlace simbolico en /etc/nginx/sites-enabled/.
#
# El puerto 80 sirve el sitio y la renovacion de certificados; el 443 lo
# sirve Nginx con el certificado de Let's Encrypt.

# --- HTTP: redireccion a HTTPS + renovacion de ACME -------------------------

server {
    listen 80;
    listen [::]:80;
    server_name gorodeals.example.com www.gorodeals.example.com;

    # Certbot valida el dominio en esta ruta (HTTP-01).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: sitio + proxy a la API ---------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gorodeals.example.com www.gorodeals.example.com;

    ssl_certificate     /etc/letsencrypt/live/gorodeals.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gorodeals.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # El contenedor web publica el sitio en 127.0.0.1:8080.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
